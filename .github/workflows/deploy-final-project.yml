name: Deploy final project

on:
  push:
    branches: [main]
    paths:
      - "index.html"
      - "assignment2/**"
      - "Assessement3/**"
      - "assignment5/**"
      - "FINAL_PROJECT/**"
      - ".github/workflows/deploy-final-project.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: FINAL_PROJECT/package-lock.json

      - name: Install dependencies
        working-directory: FINAL_PROJECT
        run: npm ci

      - name: Build
        working-directory: FINAL_PROJECT
        run: npm run build

      - name: Assemble website
        run: |
          mkdir -p _site/final-project
          cp index.html _site/index.html
          cp -r assignment2 Assessement3 assignment5 _site/
          cp -r FINAL_PROJECT/dist/* _site/final-project/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
